name: Knit Riot branch validation
on:
  push:
    branches:
      - 'knit-riot-validation/**'
permissions:
  contents: read
concurrency:
  group: knit-riot-branch-validation
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install exact test dependencies
        run: |
          python -m pip install -r knit-riot-3d-garment/requirements-test.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Check syntax and geometry invariants
        run: |
          python -m compileall -q knit-riot-3d-garment/tools
          node knit-riot-3d-garment/tools/test_geometry.cjs
          node knit-riot-3d-garment/tools/test_boundaries.cjs
          node knit-riot-3d-garment/tools/test_footwear_geometry.mjs
          python knit-riot-3d-garment/tools/test_publish_evidence.py -v
      - name: Render and test actual controls, appearances, failures and GLB round trip
        run: python knit-riot-3d-garment/tools/render_test.py
      - name: Assemble render evidence
        run: |
          python knit-riot-3d-garment/tools/persist_qa.py
          cp knit-riot-3d-garment/validation/latest/*rendered*.png knit-riot-3d-garment/test-runtime/qa/
      - name: Preserve actual review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knit-riot-branch-rendered-review
          path: |
            knit-riot-3d-garment/test-runtime/qa/results.json
            knit-riot-3d-garment/test-runtime/qa/evidence-manifest.json
            knit-riot-3d-garment/test-runtime/qa/footwear-closeups-manifest.json
            knit-riot-3d-garment/test-runtime/qa/footwear-closeups/*.png
            knit-riot-3d-garment/test-runtime/qa/*.png
            knit-riot-3d-garment/test-runtime/app.js
            knit-riot-3d-garment/test-runtime/REFINE_JS.txt
            knit-riot-3d-garment/test-runtime/CLIP_JS.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
