name: Knit Riot focused hair visual review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/knit-riot-hair-focus.yml
      - knit-riot-3d-garment/patches/runtime.json
permissions:
  contents: read
concurrency:
  group: knit-riot-hair-focus
  cancel-in-progress: true
jobs:
  hair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned browser dependency
        run: |
          python -m pip install -r knit-riot-3d-garment/requirements-test.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Build exact current runtime and capture default brunette styles
        run: |
          python - <<'PY'
          import base64, hashlib, http.server, json, pathlib, sys, threading
          from PIL import Image, ImageStat
          from playwright.sync_api import sync_playwright
          sys.path.insert(0,'knit-riot-3d-garment/tools')
          from build_runtime import build
          root=pathlib.Path('hair-focus-runtime')
          report=build(root)
          out=pathlib.Path('hair-focus');out.mkdir()
          class H(http.server.SimpleHTTPRequestHandler):
              def __init__(self,*a,**kw):super().__init__(*a,directory=str(root),**kw)
              def log_message(self,*a):pass
          server=http.server.ThreadingHTTPServer(('127.0.0.1',8765),H)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          errors=[];records=[]
          try:
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist'])
                  page=browser.new_page(viewport={'width':1100,'height':900},device_scale_factor=1)
                  page.add_init_script('window.__qaPause=true')
                  page.on('pageerror',lambda error:errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/',wait_until='networkidle',timeout=60000)
                  page.wait_for_function('window.KR && KR.ready',timeout=40000)
                  page.locator('#detail').click()
                  for style in ['wavy','straight','curly']:
                      for view in ['front','side']:
                          result=page.evaluate("""([s,v])=>{KR.change('hair','#836c57');KR.change('hairStyle',s);KR.change('length',1);KR.view(v);KR.renderer.render(KR.scene,KR.camera);return {png:KR.renderer.domElement.toDataURL('image/png'),state:{hair:KR.state.hair,hairStyle:KR.state.hairStyle,length:KR.state.length,view:KR.state.view},webglError:KR.renderer.getContext().getError()}}""",[style,view])
                          raw=base64.b64decode(result.pop('png').split(',',1)[1]);name=f'{style}-{view}.png';path=out/name;path.write_bytes(raw)
                          im=Image.open(path).convert('RGB')
                          expected={'hair':'#836c57','hairStyle':style,'length':1,'view':view}
                          if result['state']!=expected or result['webglError'] or max(ImageStat.Stat(im).stddev)<2:errors.append('state/WebGL/uniform failure '+name)
                          records.append({'path':name,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),**result})
                  browser.close()
          finally:
              server.shutdown()
          if len({r['sha256'] for r in records if r['path'].endswith('-front.png')})!=3:errors.append('Three hair styles did not produce three distinct front renders')
          base=Image.open(out/'wavy-front.png').convert('RGB')
          style_effect={}
          for style in ['straight','curly']:
              other=Image.open(out/(style+'-front.png')).convert('RGB')
              changed=0;total=base.width*base.height
              for a,b in zip(base.getdata(),other.getdata()):
                  if max(abs(a[i]-b[i]) for i in range(3))>5:changed+=1
              style_effect[style]=changed/total
              if style_effect[style]<.05:errors.append(style+' hair is not visually distinct enough from wavy in focused front render')
          result={'tested_commit':__import__('os').environ['GITHUB_SHA'],'app_sha256':report['app_sha256'],'executed_renders':len(records),'coverage':'3 implemented styles x front/side at default brunette/default length','style_changed_pixel_fraction_gt5':style_effect,'errors':errors,'visual_approval':False,'physical_hardware':False,'records':records}
          (out/'results.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({k:v for k,v in result.items() if k!='records'},indent=2))
          if errors or len(records)!=6:raise SystemExit(1)
          PY
      - name: Preserve native focused hair review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knit-riot-hair-focused-review
          path: hair-focus/
          retention-days: 1
          if-no-files-found: error
          compression-level: 9
