name: Knit Riot licensed hair source recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/knit-riot-hair-source-recovery.yml
permissions:
  contents: read
concurrency:
  group: knit-riot-hair-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned image inspection dependency
        run: python -m pip install -r knit-riot-3d-garment/requirements-test.txt
      - name: Verify original archive and retain source diagnostics before strict image validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, urllib.request, zipfile
          from PIL import Image
          expected='c681e5efd37df4007a52253a8d071aedbfe3b614f199d8dae4ae76d5bd7d95c9'
          url='https://files2.makehumancommunity.org/asset_packs/hair02/hair02_ccby.zip'
          archive=Path('hair-source.zip')
          digest=hashlib.sha256();total=0
          with urllib.request.urlopen(url,timeout=60) as response, archive.open('wb') as target:
              while True:
                  block=response.read(1024*1024)
                  if not block:break
                  total+=len(block)
                  if total>100_000_000:raise RuntimeError('Source archive exceeded 100 MB bound')
                  digest.update(block);target.write(block)
          if digest.hexdigest()!=expected:raise RuntimeError('Original licensed source checksum mismatch')
          prefix='hair/elvs_ashley_may_hair/'
          members=['80snormals.png','80shairtex1.png','elvs_ashley_may_hair.thumb','elvs_ashley_mayhair1.obj','elvs_ashley_may_hair.mhclo','elvs_ashley_mayhair1.mhmat']
          out=Path('verified-hair-source');out.mkdir()
          with zipfile.ZipFile(archive) as source:
              for name in members:
                  item=source.getinfo(prefix+name)
                  if item.file_size>20_000_000:raise RuntimeError('Selected member exceeds extraction bound')
                  (out/name).write_bytes(source.read(item))
          header=(out/'elvs_ashley_may_hair.mhclo').read_text()
          material=(out/'elvs_ashley_mayhair1.mhmat').read_text()
          assert '# author Elvaerwyn' in header and '# license CC_by' in header
          assert 'normalmapTexture 80snormals.png' in material
          (out/'ATTRIBUTION.txt').write_text('Ashley May hair geometry, diffuse and normal-map source: Elvaerwyn. Creator header identifies CC_by (CC-BY; version is not stated in that header). Original creator metadata and material are included unchanged. Source: https://static.makehumancommunity.org/assets/assetpacks/hair02.html . Archive checksum agreement is not image validity, visual improvement or measured hair optics. Do not load invalid source bytes into runtime.\n')
          import struct, zlib
          original=out/'80snormals.png'; repaired=out/'80snormals.repaired.png'
          raw=original.read_bytes(); signature=b'\x89PNG\r\n\x1a\n'
          if not raw.startswith(signature):raise RuntimeError('Normal map is not a PNG')
          pos=8;clean=bytearray(signature);invalid=[];source_idat=[];saw_iend=False
          while pos<len(raw):
              if pos+12>len(raw):raise RuntimeError('Truncated PNG chunk header')
              length=struct.unpack('>I',raw[pos:pos+4])[0]
              if length>20_000_000:raise RuntimeError('PNG chunk exceeds 20 MB bound')
              end=pos+12+length
              if end>len(raw):raise RuntimeError('Truncated PNG chunk payload')
              chunk_type=raw[pos+4:pos+8]; payload=raw[pos+8:pos+8+length]
              stored=struct.unpack('>I',raw[pos+8+length:end])[0]; computed=zlib.crc32(chunk_type+payload)&0xffffffff
              if chunk_type==b'IDAT':source_idat.append(payload)
              if stored!=computed:
                  invalid.append({'type':chunk_type.decode('ascii','replace'),'length':length,'stored_crc':stored,'computed_crc':computed})
                  if chunk_type!=b'iCCP':raise RuntimeError('Unexpected corrupt PNG chunk '+chunk_type.decode('ascii','replace'))
              else: clean.extend(raw[pos:end])
              pos=end
              if chunk_type==b'IEND':saw_iend=True;break
          if not saw_iend or pos!=len(raw):raise RuntimeError('PNG did not terminate cleanly')
          if len(invalid)!=1 or invalid[0]['type']!='iCCP':raise RuntimeError('Expected exactly one invalid ancillary iCCP chunk')
          repaired.write_bytes(clean)
          repaired_sha=hashlib.sha256(clean).hexdigest()
          if repaired_sha!='3fbca1cc964a29eec0eb24f6b8c4612b7661bedaca61db597b8a813973786cb0':raise RuntimeError('Deterministic repaired normal-map checksum mismatch')
          repaired_raw=repaired.read_bytes();q=8;repaired_idat=[]
          while q<len(repaired_raw):
              length=struct.unpack('>I',repaired_raw[q:q+4])[0];chunk_type=repaired_raw[q+4:q+8];payload=repaired_raw[q+8:q+8+length]
              if chunk_type==b'IDAT':repaired_idat.append(payload)
              q+=12+length
          if b''.join(source_idat)!=b''.join(repaired_idat):raise RuntimeError('Repair altered IDAT image data')
          original_error=None
          try:
              with Image.open(original) as image:image.verify()
          except Exception as error:original_error=type(error).__name__+': '+str(error)
          with Image.open(repaired) as image:image.verify()
          with Image.open(repaired) as image:
              if max(image.size)>8192:raise RuntimeError('Repaired normal map exceeds image-size bound')
              normal_image={'mode':image.mode,'size':list(image.size),'extrema':image.getextrema()}
          files=[{'path':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'first_32_bytes_hex':p.read_bytes()[:32].hex()} for p in sorted(out.iterdir()) if p.is_file()]
          metadata={'source_url':url,'source_page':'https://static.makehumancommunity.org/assets/assetpacks/hair02.html','source_archive_sha256':expected,'source_archive_bytes':total,'source_prefix':prefix,'author':'Elvaerwyn','license_header':'CC_by','files':files,'runtime_integration':False,'visual_improvement_validated':False,'customer_data_used':False,'original_normal_image_valid':original_error is None,'original_normal_validation_error':original_error,'invalid_source_chunks':invalid,'repair':'remove only invalid ancillary iCCP chunk; preserve all other PNG chunk bytes including IDAT','repaired_normal_image_valid':True,'repaired_normal_sha256':repaired_sha,'repaired_normal_image':normal_image,'idat_preserved':True}
          (out/'RECOVERY.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata))
          PY
      - name: Preserve exact source and failure diagnostics for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashley-may-verified-source
          path: verified-hair-source/
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
