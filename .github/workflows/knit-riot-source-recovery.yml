name: Knit Riot source recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/knit-riot-source-recovery.yml]
permissions:
  contents: read
concurrency:
  group: knit-riot-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Recover existing public staging source without changing deployment
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, pathlib, time, urllib.request, zipfile
          root = pathlib.Path('recovery')
          root.mkdir()
          url = 'https://knit-riot-studio-development.onrender.com/development-snapshot.zip'
          raw = None
          for attempt in range(3):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'KnitRiot-source-recovery/1.0'})
                  with urllib.request.urlopen(request, timeout=90) as response:
                      raw = response.read(96 * 1024 * 1024 + 1)
                  if len(raw) > 96 * 1024 * 1024:
                      raise ValueError('Snapshot exceeds recovery size limit')
                  if not zipfile.is_zipfile(io.BytesIO(raw)):
                      raise ValueError('Staging did not return a ZIP archive')
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(10)
          keys = ['BUILD_BASE','BUILD_PY','BUILD_PATCHES','APP_JS','APP_HTML','APP_PATCHES','CLIP_JS','EXTRA_JS','AFTER_BUILD','BEFORE_QA','FINAL_PATCHES','REFINE_JS','UI_GRAPHICS_PATCHES','STUDIO_JS','EXTRA_BROWSER_QA','EFFECTIVE_BROWSER_QA']
          allowed = {'source-' + key + '.txt' for key in keys}
          allowed.update(['app.js','index.html','asset-manifest.json','ATTRIBUTION.txt','PROJECT_STATUS.json','qa/results.json','qa/index.html'])
          report = {'snapshot_url':url, 'snapshot_sha256':hashlib.sha256(raw).hexdigest(), 'files':[], 'skipped':[]}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for item in archive.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or item.file_size > 32 * 1024 * 1024:
                      raise ValueError('Unsafe snapshot member')
                  name = str(path)
                  if name not in allowed and not (path.parent == pathlib.PurePosixPath('qa') and path.suffix in ['.png','.webp']):
                      report['skipped'].append(name)
                      continue
                  data = archive.read(item)
                  target = root / path
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  report['files'].append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'RECOVERY_MANIFEST.json').write_text(json.dumps(report, indent=2))
          assert (root/'app.js').exists(), 'Missing implemented application source'
          assert (root/'source-BUILD_BASE.txt').exists(), 'Missing build source'
          print(json.dumps(report, indent=2))
          PY
      - name: Archive source and existing synthetic render evidence
        uses: actions/upload-artifact@v4
        with:
          name: knit-riot-staging-source-recovery
          path: recovery/
          if-no-files-found: error
          retention-days: 3
