name: Knit Riot rendered regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/knit-riot-render-tests.yml
      - knit-riot-3d-garment/patches/**
      - knit-riot-3d-garment/tools/render_test.py
permissions:
  contents: read
concurrency:
  group: knit-riot-render-tests
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium --only-shell
          python -m pip freeze
      - name: Render, inspect pixels, exercise controls and attempt GLB round trip
        run: python knit-riot-3d-garment/tools/render_test.py
      - name: Preserve actual QA evidence even when a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knit-riot-rendered-regression
          path: |
            knit-riot-3d-garment/test-runtime/qa/
            knit-riot-3d-garment/test-runtime/app.js
            knit-riot-3d-garment/test-runtime/REFINE_JS.txt
            knit-riot-3d-garment/test-runtime/CLIP_JS.txt
          if-no-files-found: error
          retention-days: 3
