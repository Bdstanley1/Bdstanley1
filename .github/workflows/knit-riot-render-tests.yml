name: Knit Riot rendered regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/knit-riot-render-tests.yml
      - knit-riot-3d-garment/patches/**
      - knit-riot-3d-garment/tools/**
      - knit-riot-3d-garment/fixtures/**
      - knit-riot-3d-garment/recovered/**
      - knit-riot-3d-garment/requirements-test.txt
permissions:
  contents: write
concurrency:
  group: knit-riot-render-tests
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the exact validated test dependencies
        run: |
          python -m pip install -r knit-riot-3d-garment/requirements-test.txt
          python -m playwright install --with-deps chromium --only-shell
      - name: Check Python syntax, numerical garment invariants and evidence races
        run: |
          python -m compileall -q knit-riot-3d-garment/tools
          node knit-riot-3d-garment/tools/test_geometry.cjs
          python knit-riot-3d-garment/tools/test_publish_evidence.py -v
      - name: Render and test actual controls, appearances, failures and GLB round trip
        run: python knit-riot-3d-garment/tools/render_test.py
      - name: Assemble successful full render atlases and provenance
        run: |
          python knit-riot-3d-garment/tools/persist_qa.py
          cp knit-riot-3d-garment/validation/latest/*rendered*.png knit-riot-3d-garment/test-runtime/qa/
      - name: Publish matching-source evidence without binary rebase
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          python knit-riot-3d-garment/tools/publish_evidence.py \
            --tested-commit "$TESTED_COMMIT" \
            --report knit-riot-3d-garment/test-runtime/qa/publication-result.json
      - name: Archive the exact public project source for reproducible independent work
        if: always()
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          git archive --format=zip --output="$RUNNER_TEMP/knit-riot-project-source.zip" \
            "$TESTED_COMMIT" knit-riot-3d-garment .github/workflows/knit-riot-render-tests.yml
          test "$(stat -c%s "$RUNNER_TEMP/knit-riot-project-source.zip")" -lt 100000000
          cd "$RUNNER_TEMP"
          sha256sum knit-riot-project-source.zip > knit-riot-project-source.sha256
      - name: Preserve actual review images even if a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knit-riot-rendered-review
          path: |
            knit-riot-3d-garment/test-runtime/qa/results.json
            knit-riot-3d-garment/test-runtime/qa/evidence-manifest.json
            knit-riot-3d-garment/test-runtime/qa/publication-result.json
            knit-riot-3d-garment/test-runtime/qa/*.png
            knit-riot-3d-garment/test-runtime/app.js
            knit-riot-3d-garment/test-runtime/REFINE_JS.txt
            knit-riot-3d-garment/test-runtime/CLIP_JS.txt
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
      - name: Preserve pinned public source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knit-riot-pinned-project-source
          path: |
            ${{ runner.temp }}/knit-riot-project-source.zip
            ${{ runner.temp }}/knit-riot-project-source.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
