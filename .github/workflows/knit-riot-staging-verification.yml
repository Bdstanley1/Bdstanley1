name: Knit Riot staging delivery verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/knit-riot-staging-verification.yml]
permissions:
  contents: write
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual HTTPS delivery from the existing staging service
        shell: bash
        run: |
          python - <<'PY'
          import datetime, hashlib, io, json, os, pathlib, time, urllib.request, zipfile
          base='https://knit-riot-studio-development.onrender.com/'
          expected='2f244c54639dd84c0efe7417554d803f315ef5f0e5541ec8ec8c3e818a867218'
          commit='ab0a34b4b0d4d35359b2c681b3c38cb3a8785562'
          out=pathlib.Path('delivery-review');out.mkdir()
          def get(path,limit=32*1024*1024):
              request=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'KnitRiot-staging-verification/1.0'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  data=response.read(limit+1)
              assert len(data)<=limit, 'Response exceeds bounded verification size'
              return data
          def sha(data):return hashlib.sha256(data).hexdigest()
          deadline=time.monotonic()+150
          while True:
              try:
                  app=get('app.js')
                  status=json.loads(get('PROJECT_STATUS.json'))
                  assert sha(app)==expected and status.get('project_commit')==commit
                  break
              except Exception as error:
                  if time.monotonic()>=deadline:raise
                  print('Waiting for exact candidate delivery:',type(error).__name__,flush=True)
                  time.sleep(10)
          build=json.loads(get('BUILD_REPORT.json'))
          qa=json.loads(get('qa/results.json'))
          assert build['app_sha256']==expected and build['project_commit']==commit
          assert qa['app_sha256']==expected and qa['execution_status']=='completed'
          assert not qa['errors'] and not qa['capture_errors'] and qa['extended']['passed']
          assert qa['extended']['rendered_combinations']==420
          assert qa['appearance_pairwise']['case_count']==31 and qa['appearance_pairwise']['pair_count']==284
          assert qa['glb_geometry_roundtrip']['passed']
          assert status['release_status']=='HOLD' and status['visual_gate']=='NOT_APPROVED'
          records={x['path']:x for x in json.loads(get('qa/evidence-manifest.json'))}
          evidence=[]
          for name in ['desktop-detail.png','phone-neutral-front.png','glb-reloaded-detail.png']:
              data=get('qa/'+name)
              assert sha(data)==records[name]['sha256']
              (out/name).write_bytes(data)
              evidence.append({'path':'qa/'+name,'bytes':len(data),'sha256':sha(data)})
          raw=get('development-snapshot.zip',96*1024*1024)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert sum(x.file_size for x in archive.infolist())<160*1024*1024
              assert sha(archive.read('app.js'))==expected
              assert json.loads(archive.read('qa/results.json'))['app_sha256']==expected
              assert 'source-build_runtime.py.txt' in archive.namelist()
              assert 'source-render_test.py.txt' in archive.namelist()
              assert 'SOURCE_README.txt' in archive.namelist()
              manifest=json.loads(archive.read('asset-manifest.json'))
              verified=[]
              for name in ['body.json','leye.json','reye.json','skin.png','hair.png','hair.json','studio_small_08_1k.hdr']:
                  data=get('assets/'+name)
                  assert sha(data)==manifest['files'][name]['sha256']
                  assert data==archive.read('assets/'+name)
                  verified.append(name)
          result={'delivery_verified':True,'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'workflow_run_id':os.environ['GITHUB_RUN_ID'],'url':base,'project_commit':commit,'app_sha256':expected,'build_report':build,'qa_execution':qa['execution_status'],'rendered_selection_cases':420,'appearance_pairwise_cases':31,'appearance_value_pairs':284,'glb_geometry_roundtrip':qa['glb_geometry_roundtrip'],'verified_delivered_assets':verified,'source_archive_sha256':sha(raw),'source_archive_bytes':len(raw),'actual_render_images':evidence,'release_status':'HOLD','visual_realism_approved':False,'physical_fit_validated':False,'physical_hardware_tested':False}
          (out/'DELIVERY_VERIFICATION.json').write_text(json.dumps(result,indent=2))
          (out/'PROJECT_STATUS.json').write_text(json.dumps(status,indent=2))
          print(json.dumps(result,indent=2),flush=True)
          PY
      - name: Persist only verified synthetic staging evidence
        shell: bash
        run: |
          mkdir -p knit-riot-3d-garment/validation/staging
          cp delivery-review/*.json delivery-review/*.png knit-riot-3d-garment/validation/staging/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- knit-riot-3d-garment/validation/staging
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve actual delivered Render evidence and provenance'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Preserve delivered QA images and verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knit-riot-staging-delivery-review
          path: delivery-review/
          retention-days: 1
          if-no-files-found: warn
          compression-level: 9
